name: build-asi
on:
  push:
  workflow_dispatch:

env:
  PLUGIN_SDK_DIR: C:\plugin-sdk

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Get plugin-sdk
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk $env:PLUGIN_SDK_DIR

      - name: Find premake
        run: |
          $pm = "$env:PLUGIN_SDK_DIR\tools\premake\premake5.exe"
          if (-not (Test-Path $pm)) {
            Write-Host "premake5.exe not in plugin-sdk, downloading"
            Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip" -OutFile pm.zip
            Expand-Archive pm.zip C:\pm
            $pm = "C:\pm\premake5.exe"
          }
          Write-Host "premake: $pm"
          "PREMAKE=$pm" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem "$env:PLUGIN_SDK_DIR\tools" -Recurse | Select-Object -First 60 | ForEach-Object { $_.FullName }

      - name: Try to generate SDK library projects (best effort)
        continue-on-error: true
        working-directory: C:\plugin-sdk\tools\premake
        run: |
          & $env:PREMAKE vs2022
          Get-ChildItem $env:PLUGIN_SDK_DIR -Recurse -Filter *.sln | ForEach-Object { $_.FullName }

      - name: Generate plugin project
        working-directory: C:\plugin-sdk\tools\premake
        run: |
          & $env:PREMAKE newplugin --type=ASI --name=IVFHandPlacement --dir=C:\gen --gtasa
          Get-ChildItem C:\gen -Recurse | ForEach-Object { $_.FullName }

      - name: Use my source code
        run: |
          $main = Get-ChildItem C:\gen -Recurse -Filter Main.cpp | Select-Object -First 1
          if (-not $main) { throw "Main.cpp not found in generated project" }
          Copy-Item "$env:GITHUB_WORKSPACE\IVFHandPlacement.cpp" $main.FullName -Force
          "PROJDIR=$($main.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          
      - name: Build plugin-sdk library (SA)
        run: |
          $p = "C:\plugin-sdk\plugin_sa\Plugin_SA.vcxproj"
          $cfgs = Select-String -Path $p -Pattern 'ProjectConfiguration Include="([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          Write-Host "SDK project configurations:"
          $cfgs | ForEach-Object { Write-Host "  $_" }
          $rel = $cfgs | Where-Object { $_ -match '^Release' -and $_ -match 'Win32' } | Select-Object -First 1
          if (-not $rel) { throw "No Release|Win32 configuration found in Plugin_SA.vcxproj" }
          $conf, $plat = $rel -split '\|'
          Write-Host "Building SDK with Configuration=$conf Platform=$plat"
          msbuild $p /p:Configuration="$conf" /p:Platform="$plat" /p:PlatformToolset=v145 /m
          Write-Host "--- libs now:"
          Get-ChildItem $env:PLUGIN_SDK_DIR\output -Recurse -Filter *.lib -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }

      - name: Build ASI
        run: |
          msbuild C:\gen\IVFHandPlacement.vcxproj /p:Configuration="Release GTA-SA" /p:Platform=Win32 /m
          Write-Host "--- result:"
          Get-ChildItem C:\gen -Recurse -Include *.asi,*.dll | ForEach-Object { $_.FullName }
          
      - name: Collect files
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $asi = Get-ChildItem C:\gen -Recurse -Filter *.asi | Select-Object -First 1
          if (-not $asi) { throw "asi not found" }
          Copy-Item $asi.FullName out\IVFHandPlacement.asi
          Copy-Item IVFHandPlacement.ini out\

      - uses: actions/upload-artifact@v4
        with:
          name: IVFHandPlacement
          path: out/*
